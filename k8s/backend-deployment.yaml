apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: jobportal

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: ayaanb2324/jobportal-backend:latest

        imagePullPolicy: Always

        ports:

        - containerPort: 5000

        env:

        - name: PORT
          value: "5000"

        - name: NODE_ENV
          value: "production"

        - name: MONGO_URI
          value: mongodb://mongo-service:27017/jobportal

        - name: JWT_SECRET
          value: your_jwt_secret_key_change_this_in_production_env

        - name: JWT_EXPIRE
          value: 1d

        - name: FRONTEND_URL
          value: http://frontend-service

        - name: CORS_ORIGIN
          value: http://frontend-service